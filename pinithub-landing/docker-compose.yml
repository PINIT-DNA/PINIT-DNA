services:
  db:
    image: postgres:16-alpine
    container_name: pinithub-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: pinithub
      POSTGRES_PASSWORD: pinithub
      POSTGRES_DB: pinithub
    volumes:
      - pinithub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinithub -d pinithub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pinithub_pgdata:
