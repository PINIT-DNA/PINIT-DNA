<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PinIT Hub</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="28" height="28" />
      <div>
        <h1>PinIT Hub</h1>
        <p id="subtitle">Publish Guardian</p>
      </div>
    </div>
    <span id="status-pill" class="pill muted">…</span>
  </header>

  <p id="error-box" class="error hidden"></p>

  <!-- Default visible so popup is never blank if background is slow/offline -->
  <section id="signed-out">
    <p class="copy">Sign in with your PinIT Hub account to protect posts and verify media.</p>
    <button id="btn-signin" class="primary">Sign in to PinIT</button>
    <div class="code-row">
      <input id="auth-code" type="text" placeholder="Paste auth code" autocomplete="off" spellcheck="false" />
      <button id="btn-exchange" class="secondary">Connect</button>
    </div>
    <p id="api-hint" class="hint"></p>
  </section>

  <section id="signed-in" class="hidden">
    <p class="copy">Signed in as <strong id="user-id">—</strong></p>
    <div id="health-card" class="card hidden"></div>
    <div class="actions">
      <button id="btn-hub" class="secondary">Open Protected Posts</button>
      <button id="btn-assets" class="secondary">Open Assets</button>
      <button id="btn-investigate" class="secondary">Investigation</button>
      <button id="btn-signout" class="ghost">Sign out</button>
    </div>
    <div id="last-protect" class="card hidden"></div>
    <div id="capture-telemetry" class="card hidden"></div>
    <div id="last-verify" class="card hidden"></div>
    <div id="queue-status" class="card"></div>
    <p class="hint">YouTube Studio: choose a video once — PinIT protects in the background. Right-click → <em>Verify / Protect with PinIT</em>.</p>
    <div class="actions" style="margin-top:8px">
      <button id="btn-selftest" class="secondary">Run pipeline self-test</button>
      <button id="btn-flush" class="ghost">Retry queued protects</button>
      <button id="btn-sync" class="ghost">Sync from Hub</button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
