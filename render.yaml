services:
  - type: web
    name: pinit-dna-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: 30000
      - key: DATABASE_URL
        fromDatabase:
          name: pinit-dna-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: pinit-dna-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LSB_SIGNATURE_SECRET
        generateValue: true
      - key: VAULT_MASTER_SECRET
        sync: false
      # MUST match the secret used when files were vaulted (same value as local .env).
      # Do NOT rotate without re-encrypting all vault files.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SHARE_HMAC_SECRET
        sync: false
      - key: VAULT_STORAGE_DIR
        value: ./vault/encrypted
      - key: UPLOAD_TEMP_DIR
        value: ./tmp/uploads
      - key: MAX_FILE_SIZE
        value: 20971520
      - key: LOG_LEVEL
        value: info

  - type: web
    name: pinit-dna-ai
    runtime: docker
    plan: starter
    rootDir: python-ai
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: TOKENIZERS_PARALLELISM
        value: false
      - key: HF_HUB_DISABLE_PROGRESS_BARS
        value: 1

databases:
  - name: pinit-dna-db
    databaseName: pinit_dna
    plan: free
