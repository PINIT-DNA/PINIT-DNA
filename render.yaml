services:
  - type: web
    name: pinit-dna-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: AI_SERVICE_URL
        sync: false
      # The AI sidecar is its own free-tier service and sleeps independently of
      # this one. Measured cold start: 51.5s. At 30000 the first DNA generate
      # after any idle period timed out and surfaced as "Internal server error"
      # — the pipeline was fine, it was only waiting on a machine still waking.
      # Raise this only as far as the wake takes; it is not a licence for slow
      # inference. The real fix is taking that service off the free plan.
      - key: AI_SERVICE_TIMEOUT_MS
        value: 90000
      - key: DATABASE_URL
        fromDatabase:
          name: pinit-dna-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: pinit-dna-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LSB_SIGNATURE_SECRET
        generateValue: true
      - key: VAULT_MASTER_SECRET
        sync: false
      # MUST match the secret used when files were vaulted (same value as local .env).
      # Do NOT rotate without re-encrypting all vault files.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SHARE_HMAC_SECRET
        sync: false
      - key: VAULT_STORAGE_DIR
        value: ./vault/encrypted
      - key: UPLOAD_TEMP_DIR
        value: ./tmp/uploads
      - key: MAX_FILE_SIZE
        value: 524288000
      - key: LOG_LEVEL
        value: info
      # Hub -> Exchange SSO target. Without this the backend emits a localhost
      # link and the Exchange tab breaks for every deployed user.
      - key: EXCHANGE_APP_URL
        value: https://www.pinitexchange.com
      - key: MONITORING_CRAWLER_ENABLED
        value: "true"
      - key: CRAWLER_ENGINE_ENABLED
        value: "true"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: pinit-dna-ai
    runtime: docker
    plan: starter
    rootDir: python-ai
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: TOKENIZERS_PARALLELISM
        value: false
      - key: HF_HUB_DISABLE_PROGRESS_BARS
        value: 1

databases:
  - name: pinit-dna-db
    databaseName: pinit_dna
    plan: free
